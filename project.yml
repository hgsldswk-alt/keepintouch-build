name: KeepClose
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  knownRegions: [zh-Hans, en, zh-Hant, ja]
settings:
  base:
    APP_ID: com.hgsldswk.keepintouch
    APP_STORE_ID: "6838243993"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  KeepClose:
    type: application
    platform: iOS
    sources: [KeepClose, Shared]
    dependencies:
      - target: KeepCloseWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: KeepClose AppStore
    entitlements:
      path: KeepClose/KeepClose.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hgsldswk.keepintouch]
    info:
      path: KeepClose/Info.plist
      properties:
        CFBundleDisplayName: 亲友联络提醒
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        APP_STORE_ID: $(APP_STORE_ID)
        KeepCloseProProductID: $(APP_ID).pro
        KeepCloseTrialProductID: $(APP_ID).trial
        NSContactsUsageDescription: 用于从通讯录找到你想常联系的亲友，并读取他们的名字、号码、头像和生日。数据只留在你的手机上。
        NSCameraUsageDescription: 用于在见面时拍一张合照，存进这位亲友的合照时间线。
        NSPhotoLibraryAddUsageDescription: 用于把你生成的合照分享卡保存到相册。
        LSApplicationQueriesSchemes: [weixin]
        CFBundleURLTypes:
          - CFBundleURLName: com.hgsldswk.keepintouch.link
            CFBundleURLSchemes: [keepclose]
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Keep Close Settings
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.hgsldswk.keepintouch.settings]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.hgsldswk.keepintouch.settings
            UTTypeDescription: Keep Close Settings
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [keepclose]
  KeepCloseWidget:
    type: app-extension
    platform: iOS
    sources:
      - KeepCloseWidget
      - path: Shared
        excludes: [Entitlement.swift, Launch.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hgsldswk.keepintouch.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: KeepClose Widget AppStore
    entitlements:
      path: KeepCloseWidget/KeepCloseWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hgsldswk.keepintouch]
    info:
      path: KeepCloseWidget/Info.plist
      properties:
        CFBundleDisplayName: 亲友联络提醒
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  KeepCloseTests:
    type: bundle.unit-test
    platform: iOS
    sources: [KeepCloseTests]
    dependencies:
      - target: KeepClose
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  KeepCloseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [KeepCloseUITests]
    dependencies:
      - target: KeepClose
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: KeepClose
schemes:
  KeepClose:
    build:
      targets:
        KeepClose: all
        KeepCloseTests: [test]
    test:
      config: Debug
      targets: [KeepCloseTests]
  KeepCloseUI:
    build:
      targets:
        KeepClose: all
        KeepCloseUITests: [test]
    test:
      config: Debug
      targets: [KeepCloseUITests]
